services:
  sdla:
    build: .
    ports:
      - "5000:5000"
    environment:
      VISIONER_LOG_DIR: /app/data/logs
    volumes:
      - visioner-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  visioner-data:
