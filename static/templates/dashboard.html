<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visioner-Control SDLA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>Visioner-Control SDLA Dashboard</h1>
        <p class="subtitle">AI Driving Coach &amp; Smart Traffic Enforcement</p>
    </header>

    <main id="dashboard">
        <section class="card">
            <h2>Driver Skill Level</h2>
            <span id="skill" class="badge badge--{{ skill | lower }}">{{ skill }}</span>
        </section>

        <section class="card">
            <h2>Driving Tip</h2>
            <p id="tip" class="alert">{{ tip }}</p>
        </section>

        <section class="card">
            <h2>Lesson Progress</h2>
            <table>
                <tbody id="progress-table">
                    {% for key, value in progress.items() %}
                    <tr>
                        <td><strong>{{ key }}</strong></td>
                        <td>{{ value }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
